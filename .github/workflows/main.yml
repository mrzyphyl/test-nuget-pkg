name: Release

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal
    - name: Pack
      run: dotnet pack --configuration Release --no-restore -p:PackageVersion=1.0.0-dev
    - name: Publish to NuGet
      run: |
        echo "//registry.npmjs.org/:_authToken=${{ secrets.NUGET_TOKEN }}" > ~/.nuget/NuGet/NuGet.Config
        dotnet nuget push bin/Release/*.nupkg --source https://api.nuget.org/v3/index.json
      env:
        NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}